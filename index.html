<script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>

<script>
//
function d$(sel){
    return document.querySelector(sel);
}

//
function d$$(sel){
    return [...document.querySelectorAll(sel)];
}

//
function showMd(md){
    const cleanHtml = marked.parse(md);
    d$("body").innerHTML = cleanHtml;
    var eles = d$$("a");

    for (let ele of eles){
        ele.setAttribute("target","_blank");
        ele.addEventListener("click",ev=>{
            var link = ev.target;
            var href = link.getAttribute("href");

            if (href.toLowerCase().indexOf("app.standardnotes.com") >= 0){
                let text = href.split("?q=")[1];
                copyToClipboard(text);
            }
        });
    }
}

//
async function copyToClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
    console.log('Text copied to clipboard successfully!');
  } catch (err) {
    console.error('Failed to copy text: ', err);
  }
}
    
// 
function main(){
    var url = new URL(location.href);
    var md = url.searchParams.get("md");

    if (md==null){
        d$("body").innerHTML = "The param 'md' is needed in URL";
        return;
    }
    showMd(md);
}

window.onload = main;
window.addEventListener('hashchange', function(event) {
    var hash = window.location.hash.slice(1);
    showMd(decodeURIComponent(hash));
});
</script>
